<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Something went wrong – eGrocery</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f1faf3; color: #15201a; }
    .box { text-align: center; padding: 40px 30px; background: #fff; border-radius: 22px; box-shadow: 0 10px 30px rgba(16,40,24,.07); max-width: 420px; margin: 16px; }
    h1 { font-size: 24px; margin: 10px 0; }
    p { color: #6b776f; }
    a { display: inline-block; margin-top: 12px; background: #22a447; color: #fff; padding: 12px 26px; border-radius: 30px; text-decoration: none; }
  </style>
</head>
<body>
  <div class="box">
    <div style="font-size:42px">🛒</div>
    <h1>Something went wrong</h1>
    <p>We hit a snag on our side. Please try again in a moment.</p>
    <a href="/">Back to eGrocery</a>
  </div>
</body>
</html>
