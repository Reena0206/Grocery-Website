# One-click deploy on Render.com: New + > Blueprint > pick this repo.
databases:
  - name: egrocery-db
    plan: free

services:
  - type: web
    name: egrocery
    runtime: python
    plan: starter            # a paid plan is needed for the persistent disk below
    buildCommand: ./build.sh
    startCommand: gunicorn egrocery.wsgi
    disk:
      name: media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: egrocery-db
          property: connectionString
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
